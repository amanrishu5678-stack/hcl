services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: indusense
      POSTGRES_USER: indusense
      POSTGRES_PASSWORD: indusense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indusense -d indusense"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://indusense:indusense@postgres:5432/indusense
      JWT_SECRET: change-this-in-production
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
